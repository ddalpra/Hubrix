services:
  # ------------------------------------------------------
  # AUTH MODULE
  # ------------------------------------------------------
  hubrix-auth-db:
    image: postgres:18-bookworm
    container_name: hubrix-auth-db
    environment:
      POSTGRES_DB: keycloak_db
      POSTGRES_USER: keycloak_user
      POSTGRES_PASSWORD: keycloak_password
    volumes:
      - auth_db_data:/var/lib/postgresql
    networks:
      - auth-net
    restart: always

  hubrix-auth:
    image: quay.io/keycloak/keycloak:26.8.2
    container_name: hubrix-auth
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://hubrix-auth-db:5432/keycloak_db
      KC_DB_USERNAME: keycloak_user
      KC_DB_PASSWORD: keycloak_password
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin_password
    ports:
      - "8080:8080"
    depends_on:
      - hubrix-auth-db
    networks:
      - auth-net
      - core-net
    restart: always

